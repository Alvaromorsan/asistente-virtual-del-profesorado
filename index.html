<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente Virtual - IES Doctora Josefa de los Reyes</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --glass-bg: rgba(255, 255, 255, 0.95);
            --text-color: #2d3748;
            --accent-color: #764ba2;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 1250px; 
        }

        .container {
            width: 1150px;
            margin: 50px auto;
            background: var(--glass-bg);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            padding: 60px 50px;
            text-align: center;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        header {
            margin-bottom: 50px;
        }

        .logo-wrapper {
            width: 180px;
            height: 180px;
            background: white;
            border-radius: 50%;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 5px solid var(--accent-color);
            overflow: hidden;
        }

        .logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            color: #111827;
            font-size: 3em;
            margin: 0 0 15px 0;
            font-weight: 800;
            letter-spacing: -0.03em;
        }

        .subtitle {
            color: #4b5563;
            font-size: 1.5em;
            margin-bottom: 50px;
            font-weight: 500;
        }

        .grid-roles {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
        }

        .card-rol {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 20px;
            padding: 40px 20px;
            text-decoration: none;
            color: var(--text-color);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .card-rol:hover {
            transform: translateY(-15px);
            background: var(--primary-gradient);
            color: white;
            border-color: transparent;
            box-shadow: 0 25px 35px -10px rgba(118, 75, 162, 0.5);
        }

        .icon {
            font-size: 3.5em;
            margin-bottom: 20px;
        }

        .role-name {
            font-size: 1.2em;
            font-weight: 700;
            line-height: 1.3;
        }

        footer {
            margin-top: auto;
            padding: 40px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 1em;
        }

        /* Colores de iconos personalizados */
        .card-rol:nth-child(1) .icon { color: #3b82f6; }
        .card-rol:nth-child(2) .icon { color: #10b981; }
        .card-rol:nth-child(3) .icon { color: #f59e0b; }
        .card-rol:nth-child(4) .icon { color: #ef4444; }
        .card-rol:nth-child(5) .icon { color: #8b5cf6; }
        .card-rol:nth-child(6) .icon { color: #06b6d4; }
        .card-rol:nth-child(7) .icon { color: #ec4899; }
        .card-rol:nth-child(8) .icon { color: #f97316; }

        .card-rol:hover .icon {
            color: white !important;
            filter: brightness(0) invert(1);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo-wrapper">
                <!-- Nombre exacto del archivo subido -->
                <img src="Logo circular josefa.jpg" alt="Logo IES Doctora Josefa de los Reyes">
            </div>
            <h1>Asistente virtual del IES Doctora Josefa de los Reyes</h1>
            <p class="subtitle">Tipos de roles. Elige uno:</p>
        </header>

        <main class="grid-roles">
            <a href="https://gemini.google.com/gem/435ec7c2d2e6?usp=sharing" class="card-rol" target="_blank">
                <span class="icon">👨‍🏫</span>
                <span class="role-name">Profesor/a ESO</span>
            </a>

            <a href="https://gemini.google.com/gem/9cad9e19d5d7?usp=sharing" class="card-rol" target="_blank">
                <span class="icon">🛠️</span>
                <span class="role-name">Profesor/a técnico/a FP</span>
            </a>

            <a href="https://gemini.google.com/gem/74589409f41e?usp=sharing" class="card-rol" target="_blank">
                <span class="icon">📋</span>
                <span class="role-name">Tutor/a ESO</span>
            </a>

            <a href="https://gemini.google.com/gem/53bab0871a28?usp=sharing" class="card-rol" target="_blank">
                <span class="icon">🎓</span>
                <span class="role-name">Tutor/a FP</span>
            </a>

            <a href="https://gemini.google.com/gem/1c02aeab9745?usp=sharing" class="card-rol" target="_blank">
                <span class="icon">🏛️</span>
                <span class="role-name">Jefe/a Dpto</span>
            </a>

            <a href="https://gemini.google.com/gem/c6e2ccfbbaf6?usp=sharing" class="card-rol" target="_blank">
                <span class="icon">🔍</span>
                <span class="role-name">Orientador/a</span>
            </a>

            <a href="https://gemini.google.com/gem/c1b7b2cd6d66?usp=sharing" class="card-rol" target="_blank">
                <span class="icon">💡</span>
                <span class="role-name">Jefe/a FEIE</span>
            </a>

            <a href="https://gemini.google.com/gem/62d2a130308e?usp=sharing" class="card-rol" target="_blank">
                <span class="icon">🎭</span>
                <span class="role-name">Jefe/a DACE</span>
            </a>
        </main>
    </div>

    <footer>
        &copy; 2024 IES Doctora Josefa de los Reyes · Panel de IA Educativa
    </footer>

</body>
</html>
